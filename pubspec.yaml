name: engix
description: EngiX - شبکه مهندسان عمران (اپ نیتیو فلاتر)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  url_launcher: ^6.3.1
  excel: ^4.0.6
  geolocator: ^13.0.4
  record: ^5.1.2
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/images/logo.png

# آیکن اپ (اندروید + آیفون) — با دستور dart run flutter_launcher_icons ساخته میشود
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_foreground_inset: 20

# صفحهی شروع (Splash) — با دستور dart run flutter_native_splash:create ساخته می‌شود
flutter_native_splash:
  color: "#000000"
  image: assets/images/logo.png
  android_12:
    color: "#000000"
    image: assets/images/logo.png
